name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build web app with on-device analysis and sync Android project
        run: npm run build:mobile -w @mirrorai/web

      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mirrorai-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
