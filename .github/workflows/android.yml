name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    paths:

      - "apps/web/**"

      - "packages/**"

      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build web app with on-device analysis and sync Android project
        run: npm run build:mobile -w @mirrorai/web

      - name: Build debug APK (and an unsigned bundle to check the release config)
        working-directory: apps/web/android
        run: ./gradlew assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: mirrorai-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk

  build-release:
    # Signed builds for Google Play, only from main or a manual run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.MIRRORAI_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Skip when the upload key is not configured
        if: env.HAS_UPLOAD_KEY != 'true'
        run: echo "::notice::Add MIRRORAI_KEYSTORE_BASE64 and MIRRORAI_KEYSTORE_PASSWORD secrets to build signed releases."

      - if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/checkout@v4

      - if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - if: env.HAS_UPLOAD_KEY == 'true'
        run: npm ci

      - name: Build web app with on-device analysis and sync Android project
        if: env.HAS_UPLOAD_KEY == 'true'
        run: npm run build:mobile -w @mirrorai/web

      - name: Restore upload keystore
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MIRRORAI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "MIRRORAI_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: apps/web/android
        env:
          MIRRORAI_KEYSTORE_PASSWORD: ${{ secrets.MIRRORAI_KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mirrorai-release
          path: |
            apps/web/android/app/build/outputs/bundle/release/app-release.aab
            apps/web/android/app/build/outputs/apk/release/app-release.apk
